<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Four's a Crowd</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Four of them. Three share a link. Find the one who doesn't belong.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen matchday board — scoreboard strip, 2x2 sticker cards on mown turf, verdict sheet slides up over the pitch. Deliberately single dark look (floodlit pitch). */
:root{
  --turf:#0c3a2a; --turf-2:#0f4532; --chalk:#eef3ea; --chalk-dim:#a9c2b3;
  --flood:#f2d64b; --card:#f7f8f3; --ink:#122019; --ink-2:#4f6258;
  --red:#e0483a; --line:rgba(238,243,234,.16);
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body[data-look="chalk"]{--turf:#18223d;--turf-2:#1c2847;--chalk-dim:#aab4cc;--line:rgba(234,238,246,.16)}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px}
@media (max-width:420px){.topics{grid-template-columns:1fr}}
.topicbtn{appearance:none;text-align:left;border:1px solid var(--line);background:rgba(4,12,20,.45);color:var(--chalk);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.topicbtn b{font-family:var(--cond);font-weight:700;font-size:19px;line-height:1.1;letter-spacing:.01em}
.topicbtn span{font-size:13px;color:var(--chalk-dim)}
.topicbtn[aria-checked="true"]{border-color:var(--flood);box-shadow:inset 0 0 0 1px var(--flood);background:rgba(242,214,75,.08)}
.topicbtn:hover{border-color:var(--chalk-dim)}
.game{display:flex;flex-direction:column;gap:16px}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  margin:0;font-family:var(--body);color:var(--chalk);background:var(--turf);
  background-image:repeating-linear-gradient(90deg,var(--turf) 0 64px,var(--turf-2) 64px 128px);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px;box-sizing:border-box;gap:16px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--flood);outline-offset:3px}

/* Scoreboard */
.board{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;
  background:rgba(4,18,12,.72);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stage{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--flood)}
.qline{font-family:var(--display);font-size:26px;line-height:1.05;letter-spacing:.01em}
.qline small{font-family:var(--cond);font-size:15px;color:var(--chalk-dim);letter-spacing:.04em;margin-left:6px}
.lives{display:flex;gap:6px;align-items:center}
.ball{width:30px;height:30px;position:relative}
.ball svg{width:100%;height:100%;display:block;transition:transform .2s}
.ball.popped svg{opacity:.18;filter:grayscale(1);transform:scale(.8)}
.ball.popping svg{animation:pop .5s ease-out forwards}
.ball .shard{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:2px;background:var(--chalk);
  animation:shard .55s ease-out forwards}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.45)}55%{transform:scale(.4);opacity:.9}100%{transform:scale(.8);opacity:.18;filter:grayscale(1)}}
@keyframes shard{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.scoreline{grid-column:1/-1;display:flex;gap:14px;font-family:var(--cond);font-size:14px;color:var(--chalk-dim);letter-spacing:.04em;border-top:1px solid var(--line);padding-top:8px}
.scoreline b{color:var(--chalk);font-weight:700;font-variant-numeric:tabular-nums}
.progress{flex:1;height:6px;align-self:center;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--flood);width:0;transition:width .4s}

.prompt{font-family:var(--cond);font-size:18px;font-weight:600;letter-spacing:.03em;text-align:center;color:var(--chalk)}

/* Cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{appearance:none;border:0;padding:0;background:var(--card);color:var(--ink);border-radius:8px;overflow:hidden;
  display:flex;flex-direction:column;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.28);
  transition:transform .15s ease,box-shadow .15s ease;position:relative;min-width:0}
.card:hover:not(:disabled){transform:translateY(-3px) rotate(-.4deg)}
.card:nth-child(even):hover:not(:disabled){transform:translateY(-3px) rotate(.4deg)}
.card:disabled{cursor:default}
.face{aspect-ratio:4/4.3;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;position:absolute;inset:0}
.mono{font-family:var(--display);font-size:clamp(40px,11vw,72px);color:rgba(255,255,255,.94);letter-spacing:.02em;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.face::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px)}
.name{font-family:var(--cond);font-weight:700;font-size:clamp(16px,4.2vw,20px);line-height:1.1;padding:10px 12px 12px;text-transform:uppercase;letter-spacing:.02em;
  border-top:3px solid var(--ink)}
.credit{position:absolute;right:4px;bottom:3px;font-size:9px;color:#fff;background:rgba(0,0,0,.45);padding:1px 4px;border-radius:3px;z-index:2}
.card.wrong{animation:shake .4s}
.card.wrong::before{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:84px;color:var(--red);background:rgba(247,248,243,.7);z-index:3;font-family:var(--display)}
.card.right{box-shadow:0 0 0 4px var(--flood),0 10px 24px rgba(0,0,0,.3)}
.card.dim{opacity:.55}
.name.hidden{color:var(--ink-2);font-style:italic;text-transform:none;letter-spacing:0}
.name.revealed{animation:reveal .35s ease-out}
@keyframes reveal{from{background:var(--flood)}}
.face.photo{background:#20302a!important}
.credits{font-size:12px;color:var(--ink-2);line-height:1.5;border-top:1px solid #dde3dc;padding-top:10px}
.credits a{color:inherit}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(3,14,9,.62);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:560px;background:var(--card);color:var(--ink);border-radius:12px;padding:22px 22px 20px;box-sizing:border-box;
  animation:rise .28s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
@media (min-height:640px){.scrim{align-items:center}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.eyebrow{font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--ink-2)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;margin:0;text-wrap:balance}
.link{font-family:var(--cond);font-size:24px;font-weight:700;line-height:1.15;background:var(--flood);color:var(--ink);padding:10px 12px;border-radius:6px;text-wrap:balance}
.three{display:flex;flex-wrap:wrap;gap:6px}
.three span{font-family:var(--cond);font-weight:600;font-size:15px;border:1.5px solid var(--ink);border-radius:20px;padding:3px 10px}
.note{margin:0;color:var(--ink-2);font-size:16px;line-height:1.45}
.stats{display:flex;gap:18px;font-family:var(--cond);font-size:15px;color:var(--ink-2)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:8px;background:var(--ink);color:var(--card);font-family:var(--display);font-size:22px;letter-spacing:.04em;padding:14px 18px;text-transform:uppercase}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}

/* Start */
.start{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:20px}
.title{font-family:var(--display);font-size:clamp(64px,17vw,120px);line-height:.88;margin:0;letter-spacing:.005em;color:var(--chalk)}
.title em{font-style:normal;color:var(--flood);display:block}
.lede{font-size:18px;line-height:1.5;color:var(--chalk-dim);max-width:34ch;margin:0}
.rules{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-family:var(--cond);font-size:17px;max-width:420px}
.rules .k{font-family:var(--display);color:var(--flood);font-size:20px;text-align:right}
label.nick{display:flex;flex-direction:column;gap:6px;font-family:var(--cond);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--chalk-dim);max-width:420px}
label.nick input{font:500 18px var(--body);padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:rgba(4,18,12,.6);color:var(--chalk)}
.start .btn{background:var(--flood);color:var(--ink);max-width:420px}
.start .btn:hover{background:#ffe566}
.best{font-family:var(--cond);color:var(--chalk-dim);font-size:15px}
footer{font-size:12px;color:var(--chalk-dim);text-align:center;opacity:.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.grid{gap:10px}.qline{font-size:22px}.ball{width:26px;height:26px}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <section class="start" id="startView">
    <h1 class="title">Four’s<em>a Crowd</em></h1>
    <p class="lede">Four of them. Three share a link. Pick the one who doesn't belong.</p>
    <div class="topics" id="topics" role="radiogroup" aria-label="Topic"></div>
    <div class="rules">
      <span class="k" id="ruleCount">100</span><span id="ruleStages">sets, easiest first</span>
      <span class="k">3</span><span id="ruleLives">lives. Every wrong pick costs one</span>
    </div>
    <label class="nick" for="nick">Your name on the scoresheet
      <input id="nick" maxlength="24" autocomplete="nickname" placeholder="e.g. Raj">
    </label>
    <button class="btn" id="kickoff">Kick off</button>
    <div class="best" id="best"></div>
  </section>

  <section id="gameView" class="game" hidden>
    <div class="board">
      <div>
        <div class="stage" id="stage">Pre-season</div>
        <div class="qline" id="qline">Set 1<small>of 100</small></div>
      </div>
      <div class="lives" id="lives" aria-label="Lives"></div>
      <div class="scoreline">
        <span>Score <b id="score">0</b></span>
        <span>Fails <b id="fails">0</b></span>
        <div class="progress" aria-hidden="true"><i id="prog"></i></div>
      </div>
    </div>
    <div class="prompt" id="prompt">Who's the odd one out?</div>
    <div class="grid" id="grid"></div>
  </section>
  <footer id="foot"></footer>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
  const CFG = Object.assign({ api: "/api", topicsUrl: "data/topics.json", dataRoot: "data/topics/" }, window.OOO_CONFIG || {});
  const PREVIEW = window.OOO_DATA || null;   // self-contained preview build: { topics, sets: { slug: [...] } }
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  let TOPICS = [], T = null, SETS = [], PHOTOS = {};
  const cache = {};
  let playerId = store.get("ooo.pid", null); if (!playerId) { playerId = uid(); store.set("ooo.pid", playerId); }
  const S = { session: null, queue: [], idx: 0, lives: 3, score: 0, fails: 0, qStart: 0, attempt: 0, locked: false, nickname: "",
              posBag: [], oddPos: null, phase: "start", away: false, awayAt: 0, awayMs: 0, blurs: 0 };

  // Leaving the tab or window while a question is on screen (a sign of looking answers up).
  const questionLive = () => S.phase === "question" && !S.locked;
  function goneAway() { if (questionLive() && !S.away) { S.away = true; S.awayAt = performance.now(); S.blurs++; } }
  function cameBack() { if (S.away) { S.awayMs += performance.now() - S.awayAt; S.away = false; } }
  document.addEventListener("visibilitychange", () => (document.hidden ? goneAway() : cameBack()));
  window.addEventListener("blur", goneAway);
  window.addEventListener("focus", cameBack);
  const awayMsNow = () => Math.round(S.awayMs + (S.away ? performance.now() - S.awayAt : 0));
  const stage = (d) => (T && T.stages && T.stages[d]) || "";
  const word = (k, d) => (T && T.words && T.words[k]) || d;

  /* ---------- telemetry ---------- */
  function send(type, extra = {}) {
    const body = JSON.stringify(Object.assign({
      type, player_id: playerId, session_id: S.session, nickname: S.nickname || null, topic: T ? T.slug : null,
      ts: Date.now(), lives_left: S.lives, score: S.score, q_index: S.idx,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone, screen_w: window.innerWidth
    }, extra));
    try {
      if (type === "session_end" && navigator.sendBeacon) { navigator.sendBeacon(CFG.api + "/event", new Blob([body], { type: "application/json" })); return; }
      fetch(CFG.api + "/event", { method: "POST", headers: { "content-type": "application/json" }, body, keepalive: true }).catch(() => {});
    } catch {}
  }

  /* ---------- rendering ---------- */
  const ICONS = {
    ball: '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="#f7f8f3" stroke="#122019" stroke-width="1.6"/><path d="M16 10.2l4.6 3.3-1.8 5.4h-5.6l-1.8-5.4z" fill="#122019"/><path d="M16 10.2V3.6M20.6 13.5l6.1-2.1M18.8 18.9l3.8 5.2M13.2 18.9l-3.8 5.2M11.4 13.5l-6.1-2.1" stroke="#122019" stroke-width="1.4"/><path d="M12.3 2.6l3.7 1 3.7-1M27.9 9.7l-.3 3.9 2 3.2M25.4 26.3l-3.8.9-2.3 3M6.6 26.3l3.8.9 2.3 3M4.1 9.7l.3 3.9-2 3.2" stroke="#122019" stroke-width="1.4" fill="none"/></svg>',
    bulb: '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5c-5.6 0-9.8 4.2-9.8 9.5 0 3.4 1.7 5.6 3.4 7.4 1.2 1.3 2 2.5 2.2 4.1h8.4c.2-1.6 1-2.8 2.2-4.1 1.7-1.8 3.4-4 3.4-7.4 0-5.3-4.2-9.5-9.8-9.5z" fill="#f2d64b" stroke="#122019" stroke-width="1.6"/><path d="M13 13.5l3 3 3-3M16 16.5v7" stroke="#122019" stroke-width="1.4" fill="none"/><rect x="11.6" y="23.5" width="8.8" height="3" rx="1" fill="#c9ccd2" stroke="#122019" stroke-width="1.4"/><rect x="12.6" y="26.5" width="6.8" height="3" rx="1.5" fill="#c9ccd2" stroke="#122019" stroke-width="1.4"/></svg>'
  };
  const lifeIcon = () => ICONS[(T && T.lives) || "ball"] || ICONS.ball;
  function renderLives() {
    const el = $("lives"); el.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const b = document.createElement("div"); b.className = "ball" + (i >= S.lives ? " popped" : ""); b.innerHTML = lifeIcon(); el.appendChild(b);
    }
    el.setAttribute("aria-label", S.lives + " lives left");
  }
  function popBall() {
    const balls = $("lives").children, b = balls[S.lives]; if (!b) return;
    b.classList.add("popping");
    for (let i = 0; i < 8; i++) {
      const s = document.createElement("i"); s.className = "shard"; const a = (i / 8) * Math.PI * 2;
      s.style.setProperty("--dx", Math.cos(a) * 26 + "px"); s.style.setProperty("--dy", Math.sin(a) * 26 + "px"); b.appendChild(s);
    }
    setTimeout(() => { b.classList.remove("popping"); b.classList.add("popped"); b.querySelectorAll(".shard").forEach(n => n.remove()); }, 600);
  }
  function hue(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
  function initials(name) {
    const p = name.replace(/[^\p{L}\s'-]/gu, "").split(/\s+/).filter(Boolean);
    if (!p.length) return name.trim().slice(0, 3);              // numbers and symbols: show them as they are
    return (p.length === 1 ? p[0].slice(0, 2) : p[0][0] + p[p.length - 1][0]).toUpperCase();
  }
  const esc = (v) => String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const hasPhoto = (name) => !!(PHOTOS[name] && PHOTOS[name].src);
  function face(name, hidden) {
    const ph = PHOTOS[name];
    const h = hue(name);
    const bg = `linear-gradient(160deg,hsl(${h} 55% 42%),hsl(${(h + 40) % 360} 60% 26%))`;
    const mono = `<span class="mono">${esc(initials(name))}</span>`;
    if (hasPhoto(name)) return `<div class="face photo" style="background:${bg}"><img src="${esc(ph.src)}" alt="${hidden ? "Mystery picture" : esc(name)}" loading="eager" decoding="async">${ph.credit ? `<span class="credit">${esc(ph.credit)}</span>` : ""}</div>`;
    return `<div class="face" style="background:${bg}">${mono}</div>`;
  }
  function reveal(card) {
    const n = card.querySelector(".name");
    if (n && n.classList.contains("hidden")) { n.textContent = card.dataset.name; n.classList.remove("hidden"); n.classList.add("revealed"); }
  }
  function renderSet() {
    const set = S.queue[S.idx];
    S.attempt = 0; S.locked = false; S.qStart = performance.now(); S.wrong = [];
    $("stage").textContent = stage(set.d);
    $("qline").innerHTML = `Set ${S.idx + 1}<small>of ${S.queue.length}</small>`;
    $("score").textContent = S.score; $("fails").textContent = S.fails;
    $("prog").style.width = (S.idx / S.queue.length * 100) + "%";
    const g = $("grid"); g.innerHTML = "";
    // From round hideNamesAfter+1 (if the topic sets one), names are hidden on cards that have a photo.
    const hideRound = T.hideNamesAfter != null && S.idx >= T.hideNamesAfter;
    S.hidden = 0;
    S.phase = "question"; S.away = false; S.awayMs = 0; S.blurs = 0;
    // Balanced placement: in every block of four sets the answer sits once in each quadrant (0 TL, 1 TR, 2 BL, 3 BR).
    if (!S.posBag.length) S.posBag = shuffle([0, 1, 2, 3]);
    S.oddPos = S.posBag.pop();
    const others = shuffle(set.players.filter(p => p !== set.odd));
    const order = [0, 1, 2, 3].map(i => (i === S.oddPos ? set.odd : others.shift()));
    order.forEach((name, pos) => {
      const hide = hideRound && hasPhoto(name);
      if (hide) S.hidden++;
      const b = document.createElement("button"); b.className = "card"; b.type = "button"; b.dataset.name = name;
      b.setAttribute("aria-label", hide ? "Mystery picture" : name);
      b.innerHTML = face(name, hide) + `<div class="name${hide ? " hidden" : ""}">${hide ? "Who's this?" : esc(name)}</div>`;
      const img = b.querySelector("img");
      if (img) img.onerror = () => { img.replaceWith(Object.assign(document.createElement("span"), { className: "mono", textContent: initials(name) })); reveal(b); };
      b.dataset.pos = pos;
      b.onclick = () => pick(b, name);
      g.appendChild(b);
    });
    $("prompt").textContent = S.hidden ? "Names hidden. Who's the odd one out?" : "Who's the odd one out?";
    markSeen(set.id);
    send("question_shown", { set_id: set.id, d: set.d, names_hidden: S.hidden });
  }

  function pick(btn, name) {
    if (S.locked || btn.disabled) return;
    const set = S.queue[S.idx], ms = Math.round(performance.now() - S.qStart);
    S.attempt++;
    const correct = name === set.odd;
    send("answer", { set_id: set.id, d: set.d, attempt_no: S.attempt, correct: correct ? 1 : 0, ms, chosen: name, names_hidden: S.hidden,
                     lives_left: correct ? S.lives : S.lives - 1, pos: +btn.dataset.pos, odd_pos: S.oddPos, blurs: S.blurs, hidden_ms: awayMsNow() });
    if (correct) {
      S.locked = true; S.score++;
      btn.classList.add("right");
      document.querySelectorAll(".card").forEach(c => { c.disabled = true; reveal(c); if (c !== btn) c.classList.add("dim"); });
      $("score").textContent = S.score;
      setTimeout(() => verdict(set, ms), 380);
    } else {
      S.lives--; S.fails++; S.wrong.push(name);
      btn.disabled = true; btn.classList.add("wrong"); reveal(btn);
      popBall(); $("fails").textContent = S.fails;
      if (S.lives <= 0) {
        S.locked = true;
        document.querySelectorAll(".card").forEach(c => { c.disabled = true; reveal(c); });
        setTimeout(() => gameOver(set), 750);
      }
    }
  }

  function sheet(html) { cameBack(); S.phase = "verdict"; $("sheet").innerHTML = html; $("scrim").hidden = false; const f = $("sheet").querySelector("button"); f && f.focus(); }
  function closeSheet() { $("scrim").hidden = true; }

  function credits(set) {
    const rows = set.players.filter(hasPhoto).map(p => {
      const ph = PHOTOS[p], who = esc(ph.credit || "Wikimedia Commons");
      return `${esc(p)}: ${ph.page ? `<a href="${esc(ph.page)}" target="_blank" rel="noopener">${who}</a>` : who}`;
    });
    return rows.length ? `<div class="credits">Photos: ${rows.join(" · ")}</div>` : "";
  }

  function verdict(set, ms) {
    const three = set.players.filter(p => p !== set.odd);
    const first = S.attempt === 1;
    sheet(`
      <div class="eyebrow">${first ? "Spot on" : "Got there"} · ${esc(set.odd)} is the odd one out</div>
      <h2>The link</h2>
      <div class="link">${esc(set.link)}</div>
      <div class="three">${three.map(p => `<span>${esc(p)}</span>`).join("")}</div>
      ${set.oddNote ? `<p class="note">${esc(set.oddNote)}</p>` : ""}
      <div class="stats"><span>Time <b>${(ms / 1000).toFixed(1)}s</b></span><span>Wrong picks <b>${S.attempt - 1}</b></span></div>
      ${credits(set)}
      <button class="btn" id="next">${S.idx + 1 >= S.queue.length ? esc(word("lastNext", "Finish")) : "Next"}</button>`);
    $("next").onclick = () => {
      closeSheet(); S.idx++;
      if (S.idx >= S.queue.length) return finish(true);
      renderSet();
    };
  }

  function gameOver(set) {
    const three = set.players.filter(p => p !== set.odd);
    sheet(`
      <div class="eyebrow">Out of lives · Set ${S.idx + 1}</div>
      <h2>${esc(word("over", "Game over"))}</h2>
      <p class="note">It was <b>${esc(set.odd)}</b>. The other three: <b>${esc(set.link.toLowerCase())}</b> (${three.map(esc).join(", ")}).</p>
      ${set.oddNote ? `<p class="note">${esc(set.oddNote)}</p>` : ""}
      ${credits(set)}
      <div class="stats"><span>Score <b>${S.score}</b></span><span>Reached <b>${esc(stage(set.d))}</b></span></div>
      <div class="row"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home">Menu</button></div>`);
    finish(false);
    $("again").onclick = () => { closeSheet(); start(); };
    $("home").onclick = () => { closeSheet(); showStart(); };
  }

  const bestKey = () => "ooo.best." + T.slug;
  function finish(won) {
    send("session_end", { reason: won ? "completed" : "out_of_lives", furthest: S.idx + (won ? 0 : 1), phase: "over" });
    S.ended = true;
    const best = store.get(bestKey(), 0); if (S.score > best) store.set(bestKey(), S.score);
    if (won) sheet(`<div class="eyebrow">All ${S.queue.length} sets</div><h2>${esc(word("won", "Champions"))}</h2><p class="note">${esc(word("wonNote", "Every set"))} with ${S.fails} wrong pick${S.fails === 1 ? "" : "s"}. More sets coming.</p><button class="btn" id="home2">Menu</button>`), $("home2").onclick = () => { closeSheet(); showStart(); };
  }

  // Sets this browser has already been shown, per topic, so each go favours fresh ones.
  const seenKey = () => "ooo.seen." + T.slug;
  const seenSet = () => new Set(store.get(seenKey(), []));
  function markSeen(id) {
    const seen = store.get(seenKey(), []);
    if (!seen.includes(id)) { seen.push(id); store.set(seenKey(), seen.slice(-2000)); }
  }
  // Easiest stage first. If the topic sets perRun, each go draws that many sets per stage, unseen ones first;
  // once every set in a stage has been seen, that stage starts again from scratch.
  function buildQueue() {
    const tiers = {};
    SETS.forEach(s => (tiers[s.d] = tiers[s.d] || []).push(s));
    let seen = seenSet();
    return Object.keys(tiers).sort((a, b) => a - b).flatMap(k => {
      const pool = shuffle(tiers[k]);
      const n = T.perRun && T.perRun[k] != null ? Math.min(T.perRun[k], pool.length) : pool.length;
      let fresh = pool.filter(s => !seen.has(s.id));
      if (fresh.length < n) {               // stage nearly exhausted: forget this stage's history
        const ids = new Set(pool.map(s => s.id));
        store.set(seenKey(), store.get(seenKey(), []).filter(id => !ids.has(id)));
        seen = seenSet(); fresh = pool;
      }
      return fresh.slice(0, n);
    });
  }
  const runLength = () => T.perRun ? [1, 2, 3, 4, 5].reduce((t, d) => t + Math.min(+(T.perRun[d] ?? 0), SETS.filter(s => s.d === d).length), 0) : SETS.length;

  function start() {
    if (!SETS.length) return;
    S.nickname = ($("nick").value || "").trim().slice(0, 24); store.set("ooo.nick", S.nickname);
    S.session = uid(); S.queue = buildQueue(); S.idx = 0; S.lives = 3; S.score = 0; S.fails = 0; S.ended = false;
    $("startView").hidden = true; $("gameView").hidden = false;
    renderLives();
    send("session_start", { ua: navigator.userAgent.slice(0, 160), lang: navigator.language, set_count: S.queue.length });
    renderSet();
  }
  function showStart() {
    if (S.session && !S.ended) { S.ended = true; send("session_end", { reason: "left", furthest: S.idx + 1, phase: "menu" }); }
    S.phase = "start";
    $("gameView").hidden = true; $("startView").hidden = false;
    renderTopicInfo();
  }

  /* ---------- topics ---------- */
  function renderPicker() {
    $("topics").innerHTML = TOPICS.map(t => `<button type="button" class="topicbtn" role="radio" data-slug="${esc(t.slug)}" aria-checked="${t === T}"><b>${esc(t.title)}</b><span>${esc(t.subtitle || "")}</span></button>`).join("");
    $("topics").querySelectorAll(".topicbtn").forEach(b => b.onclick = () => chooseTopic(b.dataset.slug));
  }
  function renderTopicInfo() {
    if (!T) return;
    document.body.dataset.look = T.look || "pitch";
    $("ruleCount").textContent = SETS.length || "…";
    const per = SETS.length && T.perRun ? `. Each go draws ${runLength()}, new ones first` : "";
    $("ruleStages").textContent = `sets, from ${stage(1).toLowerCase()} to ${stage(5).toLowerCase()}${per}`;
    $("ruleLives").textContent = `lives. Every wrong pick ${word("lifeLost", "costs one")}`;
    $("kickoff").textContent = word("start", "Start");
    $("kickoff").disabled = !SETS.length;
    $("foot").textContent = T.footer || "";
    const best = store.get(bestKey(), 0); $("best").textContent = best ? `Your best: ${best} correct` : "";
    $("topics").querySelectorAll(".topicbtn").forEach(b => b.setAttribute("aria-checked", b.dataset.slug === T.slug));
  }
  async function loadTopic(t) {
    if (cache[t.slug]) return cache[t.slug];
    if (PREVIEW) return (cache[t.slug] = { sets: PREVIEW.sets[t.slug] || [], photos: {} });
    const base = CFG.dataRoot + t.slug + "/";
    const sets = (await (await fetch(base + "sets.json")).json()).sets;
    let photos = {};
    try { const r = await fetch(base + "photos.json"); if (r.ok) photos = await r.json(); } catch {}
    return (cache[t.slug] = { sets, photos });
  }
  async function chooseTopic(slug) {
    const t = TOPICS.find(x => x.slug === slug) || TOPICS[0];
    T = t; SETS = []; PHOTOS = {};
    store.set("ooo.topic", t.slug);
    try { history.replaceState(null, "", "#" + t.slug); } catch {}
    renderTopicInfo();
    try { const d = await loadTopic(t); if (T === t) { SETS = d.sets; PHOTOS = d.photos; } }
    catch { if (T === t) $("kickoff").textContent = "Couldn't load questions"; return; }
    renderTopicInfo();
  }

  window.addEventListener("pagehide", () => {
    if (S.session && !S.ended) {
      S.ended = true;
      const set = S.queue[S.idx];
      send("session_end", { reason: "left", furthest: S.idx + 1, phase: S.phase, set_id: set ? set.id : null, hidden_ms: awayMsNow() });
    }
  });
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if ($("gameView").hidden && h && T && h !== T.slug) chooseTopic(h); });
  $("kickoff").onclick = start;
  $("nick").value = store.get("ooo.nick", "");
  $("nick").addEventListener("keydown", e => { if (e.key === "Enter") $("kickoff").click(); });

  async function load() {
    try {
      const idx = PREVIEW ? PREVIEW.topics : await (await fetch(CFG.topicsUrl)).json();
      TOPICS = idx.topics;
      const want = location.hash.slice(1) || store.get("ooo.topic", null) || idx.default;
      T = TOPICS.find(t => t.slug === want) || TOPICS[0];
    } catch { $("kickoff").textContent = "Couldn't load questions"; $("kickoff").disabled = true; return; }
    renderPicker();
    await chooseTopic(T.slug);
  }
  load();
})();
</script>
</body>
</html>
